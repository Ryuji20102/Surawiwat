<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --ink: #22281F;
    --paper: #F6F4EC;
    --board: #1F3D2E;
    --line: #DAD5C4;
    --sage: #4C7A57;
    --clay: #D9832F;
    --card-bg: #FFFFFF;
    --muted: #8A8574;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  .wrap {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--board);
    color: #F6F4EC;
    padding: 28px 24px 22px;
    text-align: center;
  }
  header h1 { font-size: 21px; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
  header p { margin: 0; font-size: 13px; opacity: 0.8; }

  form { flex: 1; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 18px; }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  select {
    width: 100%;
    font-size: 17px;
    padding: 14px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--card-bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%2322281F' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>") no-repeat right 14px center;
    background-size: 18px;
    appearance: none;
    -webkit-appearance: none;
    color: var(--ink);
  }
  select:disabled { opacity: 0.5; }

  .photo-zone {
    border: 2px dashed var(--line);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    background: var(--card-bg);
  }
  .photo-zone.has-photo { border-style: solid; border-color: var(--sage); padding: 0; overflow: hidden; }
  .photo-preview { width: 100%; max-height: 260px; object-fit: cover; display: block; }
  .photo-btn {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    background: rgba(217,131,47,0.1);
    color: var(--clay);
    font-size: 15.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .photo-btn.retake { background: rgba(76,122,87,0.1); color: var(--sage); }
  input[type="file"] { display: none; }

  .submit-btn {
    margin-top: auto;
    width: 100%;
    padding: 17px;
    border-radius: 14px;
    border: none;
    background: var(--sage);
    color: #fff;
    font-size: 16.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .submit-btn:disabled { background: var(--line); color: var(--muted); }

  .status-msg {
    font-size: 13.5px;
    text-align: center;
    padding: 10px 14px;
    border-radius: 10px;
    display: none;
  }
  .status-msg.show { display: block; }
  .status-msg.success { background: rgba(76,122,87,0.12); color: var(--sage); }
  .status-msg.error { background: rgba(217,131,47,0.14); color: #8A3B14; }

  .spin { animation: spin 0.9s linear infinite; display: inline-flex; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { text-align: center; padding: 14px; }
  footer a { font-size: 12.5px; color: var(--muted); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>บันทึกการทำความสะอาดห้องเรียน</h1>
    <p id="today-label"></p>
  </header>

  <form id="checkin-form">
    <div>
      <label for="grade">Grade Level</label>
      <select id="grade" required>
        <option value="" disabled selected>Select grade</option>
        <option value="1">M.1</option>
        <option value="2">M.2</option>
        <option value="3">M.3</option>
        <option value="4">M.4</option>
        <option value="5">M.5</option>
        <option value="6">M.6</option>
      </select>
    </div>

    <div>
      <label for="section">Section / Group</label>
      <select id="section" required disabled>
        <option value="" disabled selected>Select grade first</option>
      </select>
    </div>

    <div>
      <label>Photo</label>
      <div class="photo-zone" id="photo-zone">
        <button type="button" class="photo-btn" id="photo-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Take / choose photo
        </button>
        <input type="file" id="photo-input" accept="image/*" capture="environment" />
      </div>
    </div>

    <div class="status-msg" id="status-msg"></div>

    <button type="submit" class="submit-btn" id="submit-btn" disabled>Submit</button>
  </form>

  <footer><a href="board.html">View today's board →</a></footer>
</div>

<script src = "app.js"></script>
</body>
</html>
